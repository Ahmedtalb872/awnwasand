name: awnwasand
description: Arabic Islamic learning application built with Flutter and Dart.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  supabase_flutter: ^2.8.4
  file_picker: ^8.1.7
  idb_shim: ^2.6.5
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  video_player: ^2.9.5
  uuid: ^4.5.1
  http: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/curriculum.json
