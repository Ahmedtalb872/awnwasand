name: Flutter checks and Android build
on: [push, pull_request]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generate platform tooling
        run: flutter create --platforms=android,web --org com.awnwasand --project-name awnwasand .
      - run: python scripts/brand_platforms.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter test --platform chrome test/media_web_test.dart
      - run: flutter build web --release
      - run: |
          backend=(--dart-define-from-file=config/public_backend.json)
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            backend+=(--dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY")
          fi
          flutter build apk --debug "${backend[@]}"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: awnwasand-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
