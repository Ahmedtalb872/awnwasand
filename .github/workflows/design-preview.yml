name: Capture Flutter UI preview
on:
  push:
    branches: [design/mobile-ui-v2]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter create --platforms=web --org com.awnwasand --project-name awnwasand .
      - name: Prepare Cairo font
        run: |
          curl --fail --location 'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf' -o assets/brand/Arabic.ttf
          python -c "import hashlib,pathlib; b=pathlib.Path('assets/brand/Arabic.ttf').read_bytes(); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest() == '25641b1c828857698457bcd9f5a102616b4e8033'"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --target lib/design_preview.dart
      - run: npm install playwright
      - name: Capture actual mobile screens
        run: |
          python -m http.server 8765 --directory build/web > /tmp/preview-server.log 2>&1 &
          node scripts/capture_ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: mahajja-ui-preview
          path: |
            preview/
            assets/brand/Arabic.ttf
